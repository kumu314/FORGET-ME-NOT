name: deploy-pages

# 构建游戏并发布到 GitHub Pages（在线试玩入口）。
# main 分支 game/** 有改动时自动部署；也可在 Actions 页手动触发任意分支。

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: game

      - name: Build (vite, base=./)
        run: npm run build
        working-directory: game

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
