<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>见我 · Until the End</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b10'/%3E%3Crect x='3' y='5' width='10' height='6' fill='%23ffd76a'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b10;
        overflow: hidden;
        /* 像素风：禁止长按选中与系统菜单 */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: crisped-edges;
      }
      noscript {
        color: #ddd;
        font: 14px/1.6 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <noscript>《见我》需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
